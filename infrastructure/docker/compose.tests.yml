# Disposable test project only. No production volumes or .env credentials are consumed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${LABLEND_TEST_DB_PASSWORD:?Generated by test fixture}
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${LABLEND_TEST_DB_PASSWORD:?Generated by test fixture}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:${LABLEND_TEST_REDIS_PORT:?Generated by test fixture}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 1s
      timeout: 3s
      retries: 60
