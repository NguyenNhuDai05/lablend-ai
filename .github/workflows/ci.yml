name: Platform and Sprint 1 CI
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'docs/**', 'chore/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: dotnet restore LabLendAI.sln
      - run: dotnet build LabLendAI.sln -c Release --no-restore
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: dotnet test LabLendAI.sln -c Release --no-build --no-restore
        env:
          LABLEND_POSTGRES_TESTS: '1'
          LABLEND_BROWSER_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-screenshots
          path: |
            .tmp/m3-browser/failure-*.png
            .tmp/incident-browser/failure-*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: ./scripts/Initialize-Environment.ps1
        shell: pwsh
      - run: docker compose config --quiet
