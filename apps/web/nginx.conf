server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location = /web-health { default_type application/json; return 200 '{"status":"Healthy"}'; }
    location = /health/live { proxy_pass http://gateway:8080/health/live; }
    location /api/ { proxy_pass http://gateway:8080; }
    location /platform/ { proxy_pass http://gateway:8080; }
    location / { try_files $uri $uri/ /index.html; }
}
